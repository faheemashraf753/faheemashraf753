<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200">
  <defs>
    <radialGradient id="footerBg" cx="50%" cy="60%" r="85%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f0f23"/>
      <stop offset="100%" stop-color="#070710"/>
    </radialGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="200" rx="14" fill="url(#footerBg)"/>
  <rect width="900" height="200" rx="14" fill="url(#centerGlow)"/>
  <rect width="900" height="200" rx="14" fill="none" stroke="#4f46e5" stroke-width="1" stroke-opacity="0.4"/>

  <!-- Bottom accent line -->
  <line x1="460" y1="199.5" x2="886" y2="199.5" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Particles -->
  <circle cx="80" cy="40" r="1.2" fill="#818cf8">
    <animate attributeName="opacity" values="0.1;0.5;0.1" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="820" cy="50" r="1" fill="#06b6d4">
    <animate attributeName="opacity" values="0.1;0.6;0.1" dur="4s" begin="1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="150" cy="160" r="1.5" fill="#a78bfa">
    <animate attributeName="opacity" values="0.1;0.4;0.1" dur="7s" begin="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="750" cy="155" r="1.2" fill="#ec4899">
    <animate attributeName="opacity" values="0.1;0.5;0.1" dur="6s" begin="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="400" cy="30" r="1" fill="#06b6d4">
    <animate attributeName="opacity" values="0.1;0.5;0.1" dur="8s" begin="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="550" cy="170" r="0.9" fill="#818cf8">
    <animate attributeName="opacity" values="0.1;0.6;0.1" dur="5.5s" begin="2.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Center content -->
  <!-- Name: large serif -->
  <text x="450" y="82" font-family="Georgia, 'Times New Roman', serif" font-size="48" font-weight="bold" fill="#f8fafc" text-anchor="middle">Faheem</text>

  <!-- Thin accent underline -->
  <line x1="300" y1="92" x2="600" y2="92" stroke="#4f46e5" stroke-width="1" stroke-opacity="0.5"/>

  <!-- Tagline italic -->
  <text x="450" y="118" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" fill="#94a3b8" font-style="italic" text-anchor="middle">Building systems that learn, adapt, and inspire.</text>

  <!-- Bottom mono strip -->
  <text x="450" y="155" font-family="'Courier New', Courier, monospace" font-size="8.5" fill="#475569" text-anchor="middle" letter-spacing="3">AI &#183; ENGINEERING &#183; MACHINE LEARNING &#183; PYTHON &#183; OPEN SOURCE</text>

  <!-- Dots separator -->
  <circle cx="310" cy="170" r="1.5" fill="#4f46e5" fill-opacity="0.6"/>
  <circle cx="450" cy="170" r="1.5" fill="#06b6d4" fill-opacity="0.6"/>
  <circle cx="590" cy="170" r="1.5" fill="#a78bfa" fill-opacity="0.6"/>

  <!-- BUILD · EXPLORE · EVOLVE -->
  <text x="450" y="186" font-family="'Courier New', Courier, monospace" font-size="9" fill="#6366f1" text-anchor="middle" letter-spacing="4">BUILD &#183; EXPLORE &#183; EVOLVE</text>
</svg>
